<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ৩ সেকেন্ড পর স্বয়ংক্রিয় রিডাইরেক্ট (JavaScript বন্ধ থাকলেও কাজ করবে) -->
    <meta http-equiv="refresh" content="3; url=https://konabari-nodirpar-jame-mosjid.blogspot.com">
    <title>কোনাবাড়ী নদীর পাড় জামে মসজিদ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0d3b2e, #185a46, #06231a);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            max-width: 450px;
            width: 100%;
        }

        .icon {
            font-size: 48px;
            margin-bottom: 15px;
            color: #d4af37; /* Gold color */
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #f1f1f1;
            line-height: 1.4;
        }

        p {
            font-size: 14px;
            color: #c0d6cf;
            margin-bottom: 25px;
        }

        /* Spinner Animation */
        .spinner-container {
            position: relative;
            width: 70px;
            height: 70px;
            margin: 0 auto 25px auto;
        }

        .spinner {
            width: 100%;
            height: 100%;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #d4af37;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Progress Bar */
        .progress-bar-container {
            width: 100%;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #d4af37, #f3e5ab);
            border-radius: 10px;
            animation: fillProgress 3s linear forwards;
        }

        @keyframes fillProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        .redirect-link {
            display: inline-block;
            margin-top: 10px;
            color: #d4af37;
            text-decoration: none;
            font-size: 13px;
            border-bottom: 1px dashed #d4af37;
            transition: color 0.3s ease;
        }

        .redirect-link:hover {
            color: #ffffff;
            border-color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">🕌</div>
        <h1>কোনাবাড়ী নদীর পাড় জামে মসজিদ</h1>
        <p>আপনাকে মূল ওয়েবসাইটে নিয়ে যাওয়া হচ্ছে...</p>

        <div class="spinner-container">
            <div class="spinner"></div>
        </div>

        <div class="progress-bar-container">
            <div class="progress-bar"></div>
        </div>

        <p style="font-size: 12px; opacity: 0.8; margin-bottom: 0;">
            স্বয়ংক্রিয়ভাবে প্রবেশ না হলে 
            <a id="targetLink" class="redirect-link" href="https://konabari-nodirpar-jame-mosjid.blogspot.com">এখানে ক্লিক করুন</a>
        </p>
    </div>

    <script>
        const targetURL = "https://konabari-nodirpar-jame-mosjid.blogspot.com";
        const delayInSeconds = 3; // ৩ সেকেন্ড পর রিডাইরেক্ট হবে

        setTimeout(() => {
            window.location.href = targetURL;
        }, delayInSeconds * 1000);
    </script>
</body>
</html>
